# Replace vaultmark.tech with your real domain before first use.
# This works as-is over plain HTTP the moment DNS points here — SSL is a
# second step (see the deploy notes), not required to get the app live.

server {
    listen 80;
    server_name vaultmark.tech www.vaultmark.tech;

    # Required for certbot's HTTP-01 domain-ownership challenge — keep this
    # servable over plain HTTP even after HTTPS is on, since cert renewals
    # use the same challenge every ~60 days.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- Uncomment this once the HTTPS block below is live, so plain-HTTP
    # visitors get bounced to HTTPS instead of served in the clear. ---
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

