# Replace vaultmarkapp.com with your real domain before first use.
# This works as-is over plain HTTP the moment DNS points here — SSL is a
# second step (see the deploy notes), not required to get the app live.

server {
    listen 80;
    server_name vaultmarkapp.com www.vaultmarkapp.com;

    # Required for certbot's HTTP-01 domain-ownership challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

